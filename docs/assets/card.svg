<?xml version="1.0" encoding="UTF-8"?>
<!-- 1280x640 social preview for awesome-ai-video-editing. Deterministic, rendered via rsvg-convert. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E94FD4"/>
      <stop offset="1" stop-color="#4FC3F7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1140" cy="100" r="220" fill="#E94FD4" opacity="0.14" filter="url(#soft)"/>
  <circle cx="180" cy="600" r="200" fill="#4FC3F7" opacity="0.10" filter="url(#soft)"/>

  <!-- film strip, top right -->
  <g opacity="0.55">
    <rect x="880" y="64" width="320" height="76" rx="8" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <g fill="#E94FD4" opacity="0.8">
      <rect x="896" y="76" width="14" height="10" rx="2"/><rect x="896" y="118" width="14" height="10" rx="2"/>
      <rect x="924" y="76" width="14" height="10" rx="2"/><rect x="924" y="118" width="14" height="10" rx="2"/>
      <rect x="952" y="76" width="14" height="10" rx="2"/><rect x="952" y="118" width="14" height="10" rx="2"/>
      <rect x="980" y="76" width="14" height="10" rx="2"/><rect x="980" y="118" width="14" height="10" rx="2"/>
      <rect x="1008" y="76" width="14" height="10" rx="2"/><rect x="1008" y="118" width="14" height="10" rx="2"/>
      <rect x="1036" y="76" width="14" height="10" rx="2"/><rect x="1036" y="118" width="14" height="10" rx="2"/>
      <rect x="1064" y="76" width="14" height="10" rx="2"/><rect x="1064" y="118" width="14" height="10" rx="2"/>
      <rect x="1092" y="76" width="14" height="10" rx="2"/><rect x="1092" y="118" width="14" height="10" rx="2"/>
      <rect x="1120" y="76" width="14" height="10" rx="2"/><rect x="1120" y="118" width="14" height="10" rx="2"/>
      <rect x="1148" y="76" width="14" height="10" rx="2"/><rect x="1148" y="118" width="14" height="10" rx="2"/>
    </g>
    <!-- play triangle in center frame -->
    <path d="M 1028 92 L 1052 102 L 1028 112 Z" fill="#4FC3F7"/>
  </g>

  <!-- accent rule -->
  <rect x="96" y="200" width="84" height="8" rx="4" fill="url(#accent)"/>

  <!-- title, two visual weights -->
  <text x="96" y="282" font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Awesome AI Video Editing</text>

  <!-- tagline -->
  <text x="98" y="345" font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="31" font-weight="500" fill="#C9D1D9">Agent-native video production — Claude Code skills, MCP servers, CLI</text>

  <!-- motif: timeline with playhead -->
  <g>
    <rect x="96" y="408" width="1088" height="120" rx="14" fill="#0D1117" stroke="#E94FD4" stroke-opacity="0.35"/>
    <!-- timeline tracks -->
    <rect x="124" y="430" width="380" height="18" rx="4" fill="#E94FD4" opacity="0.55"/>
    <rect x="516" y="430" width="250" height="18" rx="4" fill="#4FC3F7" opacity="0.55"/>
    <rect x="778" y="430" width="300" height="18" rx="4" fill="#E94FD4" opacity="0.35"/>
    <rect x="124" y="456" width="180" height="18" rx="4" fill="#4FC3F7" opacity="0.35"/>
    <rect x="316" y="456" width="560" height="18" rx="4" fill="#8B949E" opacity="0.30"/>
    <!-- playhead -->
    <rect x="640" y="420" width="3" height="62" fill="#FFFFFF" opacity="0.9"/>
    <path d="M 633 414 L 650 414 L 641.5 424 Z" fill="#FFFFFF" opacity="0.9"/>
    <!-- command line -->
    <text x="124" y="510" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace"
          font-size="24" fill="#E94FD4">claude &gt; direct · generate · cut · grade · ship</text>
  </g>

  <!-- corner badge -->
  <text x="1184" y="586" text-anchor="end" font-family="'Inter',Arial,sans-serif"
        font-size="24" font-weight="600" fill="#8B949E">110+ tools · curated June 2026 · CC0</text>
</svg>
